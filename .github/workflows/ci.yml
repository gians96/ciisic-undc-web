name: CI - Frontend CIISIC

on:
  push:
    branches: [rama-beni, staging]
  pull_request:
    branches: [rama-beni, staging]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # El build no necesita variables: la URL del backend y el token del evento
      # (NUXT_BACKEND_BASE_URL, NUXT_BACKEND_EVENT_TOKEN) se definen solo en runtime.
      - run: bun run build

